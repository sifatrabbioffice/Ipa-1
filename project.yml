name: GameHub
options:
  bundleIdPrefix: com.gamehub.emulator
targets:
  GameHub:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources: [GameHub]
    settings:
      base:
        INFOPLIST_FILE: GameHub/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        PRODUCT_BUNDLE_IDENTIFIER: com.gamehub.emulator.pro
        # Critical for loading game files
        UIFileSharingEnabled: YES
        LSSupportsOpeningDocumentsInPlace: YES
        UISupportedInterfaceOrientations: [UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
